name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

  release:
    types:
      - created

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:

    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Prepare Theos
      uses: waruhachi/theos-action@v2.4.6
      with:
        theos-src: roothide/theos
        theos-branch: master
        sdks-src: xybp888/iOS-SDKs
        sdks-branch: master
        libgcuniversal: 'false'
        altlist: 'false'

    - name: Prepare AltList
      shell: bash
      run: |
        set -euo pipefail
        git clone https://github.com/opa334/AltList.git
        cd AltList
        chmod +x install_to_theos.sh
        ARCHS="arm64 arm64e" ./install_to_theos.sh
        mkdir -p "$THEOS/include/AltList" "$THEOS/lib/iphone/roothide"
        cp AltList.h "$THEOS/include/AltList/"
        # AltList's installer does not build a roothide variant. Build it
        # separately so consumers receive roothide's .jbroot install name;
        # copying the rootless @rpath framework produces an unloadable bundle.
        make clean
        ARCHS="arm64 arm64e" make FINALPACKAGE=1 \
          THEOS_PACKAGE_SCHEME=roothide \
          TARGET="iphone:clang:16.5:15.0"
        test "$(otool -D .theos/obj/AltList.framework/AltList | tail -n 1)" = \
          "@loader_path/.jbroot/Library/Frameworks/AltList.framework/AltList"
        cp -R .theos/obj/AltList.framework "$THEOS/lib/iphone/roothide/"
        cd ..

    - name: Build package
      shell: bash
      run: |
        set -euo pipefail
        rm -f packages/*
        ARCHS="arm64 arm64e" make package-all

        roothide_deb="$(find packages -maxdepth 1 -type f \
          -name '*_iphoneos-arm64e.deb' -print -quit)"
        test -n "$roothide_deb"

        package_root="$(mktemp -d)"
        data_member="$(ar -t "$roothide_deb" | awk \
          '/^data\.tar/ && data == "" { data = $0 } END { print data }')"
        test -n "$data_member"
        ar -p "$roothide_deb" "$data_member" | \
          tar -x -C "$package_root" -f -
        pusher_binary="$(find "$package_root" -type f \
          -path '*/Library/PreferenceBundles/Pusher.bundle/Pusher' \
          -print -quit)"
        test -n "$pusher_binary"
        echo "Checking AltList load path in $pusher_binary"
        otool -L "$pusher_binary" | grep -F \
          "@loader_path/.jbroot/Library/Frameworks/AltList.framework/AltList"

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ github.workspace }}/packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
